---
name: Continuous integration

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, synchronize]
    merge_group:
    workflow_dispatch:
        inputs:
            release_pull_request_number:
                required: false
                type: string

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        name: Node v${{ matrix.node-version }}
        permissions:
            contents: read # required for actions/checkout to read the workflow source
        strategy:
            matrix:
                node-version: [22, 24, 26]
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Use Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Install dependencies
              run: npm clean-install
            - name: Static code analysis
              run: npx just lint
            - name: Compile Typescript
              run: npx just compile
            - name: Run tests
              run: npx just test
            - name: Check packages
              if: matrix.node-version == 24
              env:
                  GH_TOKEN: ${{ github.token }}
              run: npx just publish-dry-run
            - name: Coveralls
              uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  path-to-lcov: ./target/coverage/lcov.info
                  parallel: true

    workflow-security:
        runs-on: ubuntu-latest
        name: Workflow security analysis
        permissions:
            contents: read # required for actions/checkout to read the workflow source
            security-events: write # required by zizmor-action to upload SARIF to code scanning
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
            - name: Run zizmor
              id: zizmor
              uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
              with:
                  version: 1.26.1
                  persona: pedantic
                  min-severity: informational
                  min-confidence: low
                  config: .github/zizmor.yml
            - name: Fail if zizmor reported findings
              env:
                  SARIF_FILE: ${{ steps.zizmor.outputs.output-file }}
              run: |
                  count="$(jq '[.runs[].results[]] | length' "$SARIF_FILE")"
                  echo "zizmor findings: $count"
                  test "$count" -eq 0

    release-pr-context:
        runs-on: ubuntu-latest
        name: Release PR context
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'release/pr-log'
        permissions:
            pull-requests: read # required to find the release PR for the dispatched release branch
        outputs:
            number: ${{ steps.release-pull-request.outputs.number }}
        steps:
            - name: Use Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24

            - name: Find release pull request
              id: release-pull-request
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_PULL_REQUEST_BRANCH: ${{ github.ref_name }}
              run: |
                  node --input-type=module <<'NODE'
                  import fs from 'node:fs';

                  const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
                  const url = new URL(`https://api.github.com/repos/${owner}/${repo}/pulls`);
                  url.searchParams.set('base', 'main');
                  url.searchParams.set('head', `${owner}:${process.env.RELEASE_PULL_REQUEST_BRANCH}`);
                  url.searchParams.set('state', 'open');
                  url.searchParams.set('per_page', '2');

                  const response = await fetch(url, {
                      headers: {
                          accept: 'application/vnd.github+json',
                          authorization: `Bearer ${process.env.GH_TOKEN}`,
                          'x-github-api-version': '2022-11-28'
                      }
                  });

                  if (!response.ok) {
                      throw new Error(`GitHub API returned ${response.status} for release PR lookup`);
                  }

                  const pullRequests = await response.json();

                  if (!Array.isArray(pullRequests)) {
                      throw new Error('GitHub API returned an invalid release PR lookup response');
                  }

                  if (pullRequests.length !== 1) {
                      throw new Error(`Expected one release PR, found ${pullRequests.length}`);
                  }

                  const number = Number(pullRequests[0].number);

                  if (!Number.isSafeInteger(number)) {
                      throw new Error('GitHub API returned an invalid release PR number');
                  }

                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `number=${number}\n`);
                  NODE

    release-pr-policy:
        needs: release-pr-context
        runs-on: ubuntu-latest
        name: Release PR policy
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'release/pr-log'
        permissions:
            contents: read # required for actions/checkout to read the workflow source
            pull-requests: read # required to read release PR files and metadata
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Use Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm clean-install --ignore-scripts

            - name: Validate release pull request
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_EVENT_NAME: pull_request
                  GITHUB_EVENT_PATH: target/release/release-pr-event.json
                  RELEASE_PULL_REQUEST_NUMBER: ${{ needs.release-pr-context.outputs.number }}
              run: |
                  mkdir -p target/release
                  node --input-type=module <<'NODE'
                  import fs from 'node:fs';

                  const number = Number(process.env.RELEASE_PULL_REQUEST_NUMBER);

                  if (!Number.isSafeInteger(number)) {
                      throw new Error('RELEASE_PULL_REQUEST_NUMBER must be an integer');
                  }

                  fs.writeFileSync(
                      'target/release/release-pr-event.json',
                      `${JSON.stringify({ pull_request: { number } })}\n`
                  );
                  NODE
                  npx just validate-release-pr

    pull-request-label-policy:
        needs: release-pr-context
        runs-on: ubuntu-latest
        name: Pull request label policy
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'release/pr-log'
        permissions:
            contents: read # required for actions/checkout to read the workflow source
            issues: read # required to read labels assigned to the pull request
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Use Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm clean-install --ignore-scripts

            - name: Compile
              run: npx just compile

            - name: Validate pull request label
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_PULL_REQUEST_NUMBER: ${{ needs.release-pr-context.outputs.number }}
              run: node target/build/source/packages/command-line-interface/bin.entry-point.js validate-pull-request-labels "$RELEASE_PULL_REQUEST_NUMBER"

    publish-release:
        needs: build
        runs-on: ubuntu-latest
        name: Publish release
        if: >
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && inputs.release_pull_request_number != '')
        permissions:
            contents: write # required to push release tags and create GitHub releases
            id-token: write # required by npm trusted publishing to mint the OIDC token
            pull-requests: read # required to validate release PR identity before publishing
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Use Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm clean-install --ignore-scripts

            - name: Authorize release publish
              id: publish-target
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_PULL_REQUEST_NUMBER: ${{ inputs.release_pull_request_number }}
              run: |
                  set -euo pipefail

                  if [ -n "$RELEASE_PULL_REQUEST_NUMBER" ]; then
                      npx just authorize-release-publish --release-pull-request "$RELEASE_PULL_REQUEST_NUMBER"
                  else
                      npx just authorize-release-publish
                  fi

            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              if: steps.publish-target.outputs.should_publish == 'true'
              with:
                  ref: ${{ steps.publish-target.outputs.publish_commit_sha }}
                  fetch-depth: 0
                  persist-credentials: true

            - name: Use Node.js
              if: steps.publish-target.outputs.should_publish == 'true'
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24

            - name: Install dependencies
              if: steps.publish-target.outputs.should_publish == 'true'
              run: npm clean-install --ignore-scripts

            - name: Check packages
              if: steps.publish-target.outputs.should_publish == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: npx just publish-dry-run

            - name: Audit npm signatures and attestations
              if: steps.publish-target.outputs.should_publish == 'true'
              run: |
                  mkdir -p target/release
                  npm audit signatures --json --include-attestations > target/release/npm-audit-signatures.json
                  node --input-type=module <<'NODE'
                  import fs from 'node:fs/promises';

                  const report = JSON.parse(
                      await fs.readFile('target/release/npm-audit-signatures.json', { encoding: 'utf8' })
                  );
                  const packtory = report.verified.find((entry) => {
                      return entry.name === '@packtory/cli';
                  });

                  if (packtory?.attestations?.provenance?.predicateType !== 'https://slsa.dev/provenance/v1') {
                      throw new Error('Missing npm provenance for @packtory/cli');
                  }
                  NODE

            - name: Publish packages
              if: steps.publish-target.outputs.should_publish == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mkdir -p target/release
                  git config remote.origin.push 'refs/tags/*:refs/tags/*'

                  set +e
                  npx just publish-release 2>&1 | tee target/release/publish.log
                  status=${PIPESTATUS[0]}
                  set -e

                  if [ "$status" -eq 0 ]; then
                      exit 0
                  fi

                  if grep -Eiq 'attestation|oidc|provenance|rekor|sigstore|tlog' target/release/publish.log; then
                      sleep 30
                      npx just publish-release
                      exit 0
                  fi

                  exit "$status"

    coverage:
        needs: build
        runs-on: ubuntu-latest
        name: Coveralls Finished
        permissions:
            contents: read # required by coverallsapp/github-action
        steps:
            - name: Coveralls Finished
              uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  parallel-finished: true
