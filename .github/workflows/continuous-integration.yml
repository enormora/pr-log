---
name: Continuous integration

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, synchronize]
    merge_group:
    workflow_dispatch:
        inputs:
            release_pull_request_number:
                required: false
                type: string

jobs:
    build:
        runs-on: ubuntu-latest
        name: Node v${{ matrix.node-version }}
        strategy:
            matrix:
                node-version: [22, 24, 26]
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Install dependencies
              run: npm clean-install
            - name: Static code analysis
              run: npx just lint
            - name: Compile Typescript
              run: npx just compile
            - name: Run tests
              run: npx just test
            - name: Read package check release version
              id: package-check-release-version
              if: >
                  matrix.node-version == 24 &&
                  (
                      (github.event_name == 'pull_request' && github.head_ref == 'release/pr-log') ||
                      (github.event_name == 'workflow_dispatch' && github.ref_name == 'release/pr-log')
                  )
              run: |
                  node --input-type=module <<'NODE'
                  import fs from 'node:fs/promises';
                  import semver from 'semver';

                  const changelogPath = 'source/packages/command-line-interface/CHANGELOG.md';
                  const changelog = await fs.readFile(changelogPath, { encoding: 'utf8' });
                  const match = /^## (?<version>\S+) \(/u.exec(changelog);
                  const version = match?.groups?.version;

                  if (version === undefined || semver.valid(version) === null) {
                      throw new Error(`${changelogPath} does not start with a valid release version`);
                  }

                  await fs.appendFile(process.env.GITHUB_OUTPUT, `pr_log_version=${version}\n`, { encoding: 'utf8' });
                  NODE
            - name: Check packages
              if: matrix.node-version == 24
              env:
                  PR_LOG_RELEASE_VERSION: ${{ steps.package-check-release-version.outputs.pr_log_version || '9.9.9' }}
              run: npx just publish-dry-run
            - name: Coveralls
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  path-to-lcov: ./target/coverage/lcov.info
                  parallel: true

    maintain-release-pr:
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'push'
        concurrency:
            group: release-pr-maintenance
            cancel-in-progress: false
        permissions:
            actions: write
            contents: write
            issues: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: main
                  fetch-depth: 0
                  persist-credentials: true

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm clean-install --ignore-scripts

            - name: Compile TypeScript
              run: npx just compile

            - name: Prepare release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bash source/release/prepare-release.sh

            - name: Maintain release pull request
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
              run: |
                  node --input-type=module <<'NODE'
                  import fs from 'node:fs/promises';
                  import { execFileSync } from 'node:child_process';

                  const repository = process.env.GITHUB_REPOSITORY;
                  const [owner] = repository.split('/');
                  const releaseBranch = 'release/pr-log';
                  const releaseTitle = 'Prepare release';
                  const releaseBody = 'Updates changelogs for the next `pr-log` release.';
                  const changedFiles = runGit(['diff', '--name-only'])
                      .split('\n')
                      .filter((filePath) => {
                          return filePath !== '';
                      });

                  function runGit(args) {
                      return execFileSync('git', args, { encoding: 'utf8' }).trim();
                  }

                  async function githubApi(path, options = {}) {
                      const response = await fetch(`https://api.github.com${path}`, {
                          ...options,
                          headers: {
                              Accept: 'application/vnd.github+json',
                              Authorization: `Bearer ${process.env.GH_TOKEN}`,
                              'X-GitHub-Api-Version': '2022-11-28',
                              ...options.headers
                          }
                      });

                      if (!response.ok) {
                          const body = await response.text();
                          throw new Error(`GitHub API request failed: ${response.status} ${response.statusText}\n${body}`);
                      }

                      const body = await response.text();
                      return body === '' ? undefined : JSON.parse(body);
                  }

                  async function githubApiOrUndefined(path, options = {}) {
                      const response = await fetch(`https://api.github.com${path}`, {
                          ...options,
                          headers: {
                              Accept: 'application/vnd.github+json',
                              Authorization: `Bearer ${process.env.GH_TOKEN}`,
                              'X-GitHub-Api-Version': '2022-11-28',
                              ...options.headers
                          }
                      });

                      if (response.status === 404 || response.status === 422) {
                          return undefined;
                      }

                      if (!response.ok) {
                          const body = await response.text();
                          throw new Error(`GitHub API request failed: ${response.status} ${response.statusText}\n${body}`);
                      }

                      const body = await response.text();
                      return body === '' ? undefined : JSON.parse(body);
                  }

                  async function listOpenReleasePullRequests() {
                      return githubApi(
                          `/repos/${repository}/pulls?state=open&head=${encodeURIComponent(`${owner}:${releaseBranch}`)}&base=main`
                      );
                  }

                  async function closeReleasePullRequests() {
                      const pullRequests = await listOpenReleasePullRequests();

                      await Promise.all(
                          pullRequests.map((pullRequest) => {
                              return githubApi(`/repos/${repository}/pulls/${pullRequest.number}`, {
                                  method: 'PATCH',
                                  body: JSON.stringify({ state: 'closed' })
                              });
                          })
                      );
                  }

                  async function deleteReleaseBranch() {
                      await githubApiOrUndefined(`/repos/${repository}/git/refs/heads/${releaseBranch}`, {
                          method: 'DELETE'
                      });
                  }

                  async function upsertReleaseBranch(commitSha) {
                      const existingRef = await githubApiOrUndefined(`/repos/${repository}/git/ref/heads/${releaseBranch}`);

                      if (existingRef === undefined) {
                          await githubApi(`/repos/${repository}/git/refs`, {
                              method: 'POST',
                              body: JSON.stringify({ ref: `refs/heads/${releaseBranch}`, sha: commitSha })
                          });
                          return;
                      }

                      await githubApi(`/repos/${repository}/git/refs/heads/${releaseBranch}`, {
                          method: 'PATCH',
                          body: JSON.stringify({ sha: commitSha, force: true })
                      });
                  }

                  async function createReleaseCommit() {
                      const mainHead = runGit(['rev-parse', 'HEAD']);
                      const mainRef = await githubApi(`/repos/${repository}/git/ref/heads/main`);

                      if (mainRef.object.sha !== mainHead) {
                          throw new Error(`main moved while preparing the release: expected ${mainHead}, found ${mainRef.object.sha}`);
                      }

                      const parentCommit = await githubApi(`/repos/${repository}/git/commits/${mainHead}`);
                      const treeEntries = [];

                      for (const changedFile of changedFiles) {
                          const content = await fs.readFile(changedFile, { encoding: 'utf8' });
                          const blob = await githubApi(`/repos/${repository}/git/blobs`, {
                              method: 'POST',
                              body: JSON.stringify({ content, encoding: 'utf-8' })
                          });

                          treeEntries.push({ path: changedFile, mode: '100644', type: 'blob', sha: blob.sha });
                      }

                      const tree = await githubApi(`/repos/${repository}/git/trees`, {
                          method: 'POST',
                          body: JSON.stringify({ base_tree: parentCommit.tree.sha, tree: treeEntries })
                      });
                      const commit = await githubApi(`/repos/${repository}/git/commits`, {
                          method: 'POST',
                          body: JSON.stringify({ message: releaseTitle, tree: tree.sha, parents: [mainHead] })
                      });

                      await upsertReleaseBranch(commit.sha);

                      return commit.sha;
                  }

                  async function createOrUpdatePullRequest(commitSha) {
                      const openPullRequests = await listOpenReleasePullRequests();
                      const existingPullRequest = openPullRequests[0];
                      const pullRequest =
                          existingPullRequest ??
                          (await githubApi(`/repos/${repository}/pulls`, {
                              method: 'POST',
                              body: JSON.stringify({
                                  title: releaseTitle,
                                  head: releaseBranch,
                                  base: 'main',
                                  body: releaseBody
                              })
                          }));

                      await githubApi(`/repos/${repository}/pulls/${pullRequest.number}`, {
                          method: 'PATCH',
                          body: JSON.stringify({ title: releaseTitle, body: releaseBody })
                      });
                      await githubApi(`/repos/${repository}/issues/${pullRequest.number}/labels`, {
                          method: 'PUT',
                          body: JSON.stringify({ labels: ['release'] })
                      });
                      await githubApi(`/repos/${repository}/actions/workflows/continuous-integration.yml/dispatches`, {
                          method: 'POST',
                          body: JSON.stringify({ ref: releaseBranch })
                      });

                      console.log(`Release PR #${pullRequest.number} points at ${commitSha}`);
                  }

                  if (changedFiles.length === 0) {
                      await closeReleasePullRequests();
                      await deleteReleaseBranch();
                      console.log('No release content remains');
                  } else {
                      await createOrUpdatePullRequest(await createReleaseCommit());
                  }
                  NODE

    publish-release:
        needs: build
        runs-on: ubuntu-latest
        if: >
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && inputs.release_pull_request_number != '')
        permissions:
            contents: write
            id-token: write
            pull-requests: read
        steps:
            - name: Resolve release publish target
              id: publish-target
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  GITHUB_SHA: ${{ github.sha }}
                  RELEASE_PULL_REQUEST_NUMBER: ${{ inputs.release_pull_request_number }}
              run: |
                  node --input-type=module <<'NODE'
                  import fs from 'node:fs/promises';

                  const releaseLabel = 'release';

                  async function writeOutput(name, value) {
                      await fs.appendFile(process.env.GITHUB_OUTPUT, `${name}=${value}\n`, { encoding: 'utf8' });
                  }

                  async function githubApi(path) {
                      const response = await fetch(`https://api.github.com${path}`, {
                          headers: {
                              Accept: 'application/vnd.github+json',
                              Authorization: `Bearer ${process.env.GH_TOKEN}`,
                              'X-GitHub-Api-Version': '2022-11-28'
                          }
                      });

                      if (!response.ok) {
                          const body = await response.text();
                          throw new Error(`GitHub API request failed: ${response.status} ${response.statusText}\n${body}`);
                      }

                      const body = await response.text();
                      return body === '' ? undefined : JSON.parse(body);
                  }

                  function hasReleaseLabel(pullRequest) {
                      return pullRequest.labels.some((label) => {
                          return label.name === releaseLabel;
                      });
                  }

                  if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
                      const pullRequest = await githubApi(
                          `/repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.RELEASE_PULL_REQUEST_NUMBER}`
                      );

                      if (pullRequest.merged_at === null || !hasReleaseLabel(pullRequest)) {
                          throw new Error(`Pull request #${pullRequest.number} is not a merged release PR`);
                      }

                      await writeOutput('should_publish', 'true');
                      await writeOutput('release_commit_sha', pullRequest.merge_commit_sha);
                      await writeOutput('release_pull_request_number', String(pullRequest.number));
                  } else {
                      const pullRequests = await githubApi(
                          `/repos/${process.env.GITHUB_REPOSITORY}/commits/${process.env.GITHUB_SHA}/pulls`
                      );
                      const releasePullRequests = pullRequests.filter((pullRequest) => {
                          return (
                              pullRequest.merged_at !== null &&
                              pullRequest.merge_commit_sha === process.env.GITHUB_SHA &&
                              hasReleaseLabel(pullRequest)
                          );
                      });

                      if (releasePullRequests.length === 0) {
                          await writeOutput('should_publish', 'false');
                          process.exit(0);
                      }

                      if (releasePullRequests.length > 1) {
                          throw new Error(`Commit ${process.env.GITHUB_SHA} is associated with multiple release PRs`);
                      }

                      await writeOutput('should_publish', 'true');
                      await writeOutput('release_commit_sha', process.env.GITHUB_SHA);
                      await writeOutput('release_pull_request_number', String(releasePullRequests[0].number));
                  }
                  NODE

            - uses: actions/checkout@v6
              if: steps.publish-target.outputs.should_publish == 'true'
              with:
                  ref: ${{ steps.publish-target.outputs.release_commit_sha }}
                  fetch-depth: 0
                  persist-credentials: true

            - name: Use Node.js
              if: steps.publish-target.outputs.should_publish == 'true'
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Install dependencies
              if: steps.publish-target.outputs.should_publish == 'true'
              run: npm clean-install --ignore-scripts

            - name: Validate release commit
              id: release-metadata
              if: steps.publish-target.outputs.should_publish == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_COMMIT_SHA: ${{ steps.publish-target.outputs.release_commit_sha }}
              run: |
                  node --input-type=module <<'NODE'
                  import fs from 'node:fs/promises';
                  import { execFileSync } from 'node:child_process';
                  import semver from 'semver';

                  const cliChangelog = 'source/packages/command-line-interface/CHANGELOG.md';
                  const coreChangelog = 'source/packages/core/CHANGELOG.md';

                  function runGit(args) {
                      return execFileSync('git', args, { encoding: 'utf8' }).trim();
                  }

                  function readChangelogVersion(changelog, changelogPath) {
                      const match = /^## (?<version>\S+) \(/u.exec(changelog);
                      const version = match?.groups?.version;

                      if (version === undefined || semver.valid(version) === null) {
                          throw new Error(`${changelogPath} does not start with a valid release version`);
                      }

                      return version;
                  }

                  function assertTagDoesNotExist(tagName) {
                      try {
                          runGit(['rev-parse', '--verify', `refs/tags/${tagName}`]);
                      } catch {
                          return;
                      }

                      throw new Error(`Release tag already exists: ${tagName}`);
                  }

                  async function writeOutput(name, value) {
                      await fs.appendFile(process.env.GITHUB_OUTPUT, `${name}=${value}\n`, { encoding: 'utf8' });
                  }

                  async function githubApi(path) {
                      const response = await fetch(`https://api.github.com${path}`, {
                          headers: {
                              Accept: 'application/vnd.github+json',
                              Authorization: `Bearer ${process.env.GH_TOKEN}`,
                              'X-GitHub-Api-Version': '2022-11-28'
                          }
                      });

                      if (!response.ok) {
                          const body = await response.text();
                          throw new Error(`GitHub API request failed: ${response.status} ${response.statusText}\n${body}`);
                      }

                      const body = await response.text();
                      return body === '' ? undefined : JSON.parse(body);
                  }

                  const headSha = runGit(['rev-parse', 'HEAD']);

                  if (headSha !== process.env.RELEASE_COMMIT_SHA) {
                      throw new Error(`HEAD ${headSha} does not match release commit ${process.env.RELEASE_COMMIT_SHA}`);
                  }

                  const subject = runGit(['log', '-1', '--format=%s']);

                  if (subject !== 'Prepare release') {
                      throw new Error(`Unexpected release commit subject: ${subject}`);
                  }

                  const commit = await githubApi(`/repos/${process.env.GITHUB_REPOSITORY}/commits/${headSha}`);

                  if (commit.commit.verification.verified !== true) {
                      throw new Error(`Release commit is not verified: ${commit.commit.verification.reason}`);
                  }

                  const parent = runGit(['rev-parse', 'HEAD^']);
                  const changedFiles = runGit(['diff', '--name-only', parent, 'HEAD'])
                      .split('\n')
                      .filter((filePath) => {
                          return filePath !== '';
                      });
                  const hasCoreRelease = changedFiles.includes(coreChangelog);
                  const allowedFiles = new Set([cliChangelog]);

                  if (hasCoreRelease) {
                      allowedFiles.add(coreChangelog);
                  }

                  if (!changedFiles.includes(cliChangelog)) {
                      throw new Error(`${cliChangelog} must be changed`);
                  }

                  for (const changedFile of changedFiles) {
                      if (!allowedFiles.has(changedFile)) {
                          throw new Error(`Unexpected release file change: ${changedFile}`);
                      }
                  }

                  const cliChangelogContent = await fs.readFile(cliChangelog, { encoding: 'utf8' });
                  const prLogVersion = readChangelogVersion(cliChangelogContent, cliChangelog);
                  const prLogTag = `pr-log@${prLogVersion}`;
                  let predictedCoreVersion = '';
                  let predictedCoreTag = '';

                  if (hasCoreRelease) {
                      const coreChangelogContent = await fs.readFile(coreChangelog, { encoding: 'utf8' });
                      predictedCoreVersion = readChangelogVersion(coreChangelogContent, coreChangelog);
                      predictedCoreTag = `@pr-log/core@${predictedCoreVersion}`;
                  }

                  assertTagDoesNotExist(prLogTag);

                  if (hasCoreRelease) {
                      assertTagDoesNotExist(predictedCoreTag);
                  }

                  await writeOutput('pr_log_version', prLogVersion);
                  await writeOutput('pr_log_tag', prLogTag);
                  await writeOutput('core_release_needed', hasCoreRelease ? 'true' : 'false');
                  await writeOutput('predicted_core_version', predictedCoreVersion);
                  await writeOutput('predicted_core_tag', predictedCoreTag);
                  NODE

            - name: Check packages
              if: steps.publish-target.outputs.should_publish == 'true'
              env:
                  PR_LOG_RELEASE_VERSION: ${{ steps.release-metadata.outputs.pr_log_version }}
              run: npx just publish-dry-run

            - name: Audit npm signatures and attestations
              if: steps.publish-target.outputs.should_publish == 'true'
              run: |
                  mkdir -p target/release
                  npm audit signatures --json --include-attestations > target/release/npm-audit-signatures.json
                  node --input-type=module <<'NODE'
                  import fs from 'node:fs/promises';

                  const report = JSON.parse(
                      await fs.readFile('target/release/npm-audit-signatures.json', { encoding: 'utf8' })
                  );
                  const packtory = report.verified.find((entry) => {
                      return entry.name === '@packtory/cli';
                  });

                  if (packtory?.attestations?.provenance?.predicateType !== 'https://slsa.dev/provenance/v1') {
                      throw new Error('Missing npm provenance for @packtory/cli');
                  }
                  NODE

            - name: Publish packages
              if: steps.publish-target.outputs.should_publish == 'true'
              env:
                  PR_LOG_RELEASE_VERSION: ${{ steps.release-metadata.outputs.pr_log_version }}
              run: |
                  mkdir -p target/release
                  set +e
                  PR_LOG_RELEASE_VERSION="$PR_LOG_RELEASE_VERSION" npx just publish 2>&1 | tee target/release/publish.log
                  status=${PIPESTATUS[0]}
                  set -e

                  if [ "$status" -eq 0 ]; then
                      exit 0
                  fi

                  if grep -Eiq 'attestation|oidc|provenance|rekor|sigstore|tlog' target/release/publish.log; then
                      sleep 30
                      PR_LOG_RELEASE_VERSION="$PR_LOG_RELEASE_VERSION" npx just publish
                      exit 0
                  fi

                  exit "$status"

            - name: Validate core package version
              if: >
                  steps.publish-target.outputs.should_publish == 'true' &&
                  steps.release-metadata.outputs.core_release_needed == 'true'
              env:
                  PREDICTED_CORE_VERSION: ${{ steps.release-metadata.outputs.predicted_core_version }}
              run: |
                  node --input-type=module <<'NODE'
                  import { execFileSync } from 'node:child_process';

                  function readPublishedCoreVersion() {
                      try {
                          const output = execFileSync('npm', ['view', '@pr-log/core', 'version', '--json'], {
                              encoding: 'utf8'
                          }).trim();

                          return JSON.parse(output);
                      } catch {
                          return undefined;
                      }
                  }

                  for (let attempt = 1; attempt <= 12; attempt += 1) {
                      const publishedCoreVersion = readPublishedCoreVersion();

                      if (publishedCoreVersion === process.env.PREDICTED_CORE_VERSION) {
                          process.exit(0);
                      }

                      if (attempt === 12) {
                          throw new Error(
                              `Packtory published @pr-log/core ${publishedCoreVersion}, expected ${process.env.PREDICTED_CORE_VERSION}`
                          );
                      }

                      await new Promise((resolve) => {
                          setTimeout(resolve, 10_000);
                      });
                  }
                  NODE

            - name: Push release tags
              if: steps.publish-target.outputs.should_publish == 'true'
              env:
                  PR_LOG_TAG: ${{ steps.release-metadata.outputs.pr_log_tag }}
                  CORE_RELEASE_NEEDED: ${{ steps.release-metadata.outputs.core_release_needed }}
                  PREDICTED_CORE_TAG: ${{ steps.release-metadata.outputs.predicted_core_tag }}
              run: |
                  git tag "$PR_LOG_TAG"

                  if [ "$CORE_RELEASE_NEEDED" = "true" ]; then
                      git tag "$PREDICTED_CORE_TAG"
                  fi

                  git push origin "$PR_LOG_TAG"

                  if [ "$CORE_RELEASE_NEEDED" = "true" ]; then
                      git push origin "$PREDICTED_CORE_TAG"
                  fi

    coverage:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Coveralls Finished
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  parallel-finished: true
