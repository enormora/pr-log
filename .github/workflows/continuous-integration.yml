---
name: Continuous integration

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, synchronize]
    merge_group:
    workflow_dispatch:
        inputs:
            release_pull_request_number:
                required: false
                type: string

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        name: Node v${{ matrix.node-version }}
        permissions:
            contents: read # required for actions/checkout to read the workflow source
        strategy:
            matrix:
                node-version: [22, 24, 26]
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Use Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Install dependencies
              run: npm clean-install
            - name: Static code analysis
              run: npx just lint
            - name: Compile Typescript
              run: npx just compile
            - name: Run tests
              run: npx just test
            - name: Check packages
              if: matrix.node-version == 24
              env:
                  GH_TOKEN: ${{ github.token }}
              run: npx just publish-dry-run
            - name: Coveralls
              uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  path-to-lcov: ./target/coverage/lcov.info
                  parallel: true

    workflow-security:
        runs-on: ubuntu-latest
        name: Workflow security analysis
        permissions:
            contents: read # required for actions/checkout to read the workflow source
            security-events: write # required by zizmor-action to upload SARIF to code scanning
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
            - name: Run zizmor
              id: zizmor
              uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
              with:
                  version: 1.26.1
                  persona: pedantic
                  min-severity: informational
                  min-confidence: low
                  config: .github/zizmor.yml
            - name: Fail if zizmor reported findings
              env:
                  SARIF_FILE: ${{ steps.zizmor.outputs.output-file }}
              run: |
                  count="$(jq '[.runs[].results[]] | length' "$SARIF_FILE")"
                  echo "zizmor findings: $count"
                  test "$count" -eq 0

    maintain-release-pr:
        needs: build
        runs-on: ubuntu-latest
        name: Maintain release PR
        if: github.event_name == 'push'
        concurrency:
            group: release-pr-maintenance
            cancel-in-progress: false
        permissions:
            actions: write # required to dispatch release PR CI and delete gated PR runs
            contents: write # required to push and delete the release branch
            issues: write # required to replace release PR labels
            pull-requests: write # required to create, update, and close release PRs
            statuses: write # required to mirror dispatched release PR CI results
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: main
                  fetch-depth: 0
                  persist-credentials: true

            - name: Use Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm clean-install --ignore-scripts

            - name: Configure release author
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            - name: Maintain release pull request
              env:
                  GH_TOKEN: ${{ github.token }}
              run: npx just prepare-release

    publish-release:
        needs: build
        runs-on: ubuntu-latest
        name: Publish release
        if: >
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && inputs.release_pull_request_number != '')
        permissions:
            contents: write # required to push release tags and create GitHub releases
            id-token: write # required by npm trusted publishing to mint the OIDC token
            pull-requests: read # required to validate release PR identity before publishing
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Use Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm clean-install --ignore-scripts

            - name: Authorize release publish
              id: publish-target
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_PULL_REQUEST_NUMBER: ${{ inputs.release_pull_request_number }}
              run: |
                  set -euo pipefail

                  if [ -n "$RELEASE_PULL_REQUEST_NUMBER" ]; then
                      npx just authorize-release-publish --release-pull-request "$RELEASE_PULL_REQUEST_NUMBER"
                  else
                      npx just authorize-release-publish
                  fi

            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              if: steps.publish-target.outputs.should_publish == 'true'
              with:
                  ref: ${{ steps.publish-target.outputs.publish_commit_sha }}
                  fetch-depth: 0
                  persist-credentials: true

            - name: Use Node.js
              if: steps.publish-target.outputs.should_publish == 'true'
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24

            - name: Install dependencies
              if: steps.publish-target.outputs.should_publish == 'true'
              run: npm clean-install --ignore-scripts

            - name: Check packages
              if: steps.publish-target.outputs.should_publish == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: npx just publish-dry-run

            - name: Audit npm signatures and attestations
              if: steps.publish-target.outputs.should_publish == 'true'
              run: |
                  mkdir -p target/release
                  npm audit signatures --json --include-attestations > target/release/npm-audit-signatures.json
                  node --input-type=module <<'NODE'
                  import fs from 'node:fs/promises';

                  const report = JSON.parse(
                      await fs.readFile('target/release/npm-audit-signatures.json', { encoding: 'utf8' })
                  );
                  const packtory = report.verified.find((entry) => {
                      return entry.name === '@packtory/cli';
                  });

                  if (packtory?.attestations?.provenance?.predicateType !== 'https://slsa.dev/provenance/v1') {
                      throw new Error('Missing npm provenance for @packtory/cli');
                  }
                  NODE

            - name: Publish packages
              if: steps.publish-target.outputs.should_publish == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mkdir -p target/release
                  git config remote.origin.push 'refs/tags/*:refs/tags/*'

                  set +e
                  npx just publish-release 2>&1 | tee target/release/publish.log
                  status=${PIPESTATUS[0]}
                  set -e

                  if [ "$status" -eq 0 ]; then
                      exit 0
                  fi

                  if grep -Eiq 'attestation|oidc|provenance|rekor|sigstore|tlog' target/release/publish.log; then
                      sleep 30
                      npx just publish-release
                      exit 0
                  fi

                  exit "$status"

    coverage:
        needs: build
        runs-on: ubuntu-latest
        name: Coveralls Finished
        permissions:
            contents: read # required by coverallsapp/github-action
        steps:
            - name: Coveralls Finished
              uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  parallel-finished: true
