---
name: Continuous integration

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, synchronize]
    merge_group:
    workflow_dispatch:
        inputs:
            release_pull_request_number:
                required: false
                type: string

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        name: Node v${{ matrix.node-version }}
        permissions:
            contents: read # required for actions/checkout to read the workflow source
        strategy:
            matrix:
                node-version: [22, 24, 26]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Install dependencies
              run: npm clean-install
            - name: Static code analysis
              run: npx just lint
            - name: Compile Typescript
              run: npx just compile
            - name: Run tests
              run: npx just test
            - name: Check packages
              if: matrix.node-version == 24
              env:
                  GH_TOKEN: ${{ github.token }}
              run: npx just publish-dry-run
            - name: Coveralls
              if: matrix.node-version == 24
              continue-on-error: true
              timeout-minutes: 2
              uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  path-to-lcov: ./target/coverage/lcov.info
                  fail-on-error: false

    workflow-security:
        runs-on: ubuntu-latest
        name: Workflow security analysis
        permissions:
            contents: read # required for actions/checkout to read the workflow source
            security-events: write # required by zizmor-action to upload SARIF to code scanning
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Run zizmor
              id: zizmor
              uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
              with:
                  version: 1.27.0
                  persona: pedantic
                  min-severity: informational
                  min-confidence: low
                  config: .github/zizmor.yml
            - name: Fail if zizmor reported findings
              env:
                  SARIF_FILE: ${{ steps.zizmor.outputs.output-file }}
              run: |
                  count="$(jq '[.runs[].results[]] | length' "$SARIF_FILE")"
                  echo "zizmor findings: $count"
                  test "$count" -eq 0

    release-pr-policy:
        runs-on: ubuntu-latest
        name: Release PR policy
        if: >
            github.event_name == 'pull_request' ||
            github.event_name == 'merge_group' ||
            (github.event_name == 'workflow_dispatch' && github.ref_name == 'release/pr-log')
        permissions:
            contents: read # required for actions/checkout to read the workflow source
            pull-requests: read # required to read release PR files and metadata
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm clean-install --ignore-scripts

            - name: Validate release pull request
              if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: npx just validate-release-pr

    publish-release:
        needs: build
        name: Publish release
        if: >
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && inputs.release_pull_request_number != '')
        uses: ./.github/workflows/release-publish.yml
        permissions:
            contents: write # required to create release tags and GitHub releases
            id-token: write # required by npm trusted publishing to mint the OIDC token
            pull-requests: read # required to validate release PR identity before publishing
        with:
            release_pull_request_number: ${{ inputs.release_pull_request_number || '' }}

    maintain-release-pr:
        needs: publish-release
        runs-on: ubuntu-latest
        name: Maintain release PR
        if: >
            always() &&
            (
                github.event_name == 'push' ||
                (github.event_name == 'workflow_dispatch' && inputs.release_pull_request_number == '')
            ) &&
            needs.publish-release.result != 'failure' &&
            needs.publish-release.result != 'cancelled'
        permissions:
            actions: write # required to dispatch release PR CI and delete gated PR runs
            contents: write # required to push and delete the release branch
            issues: write # required to replace release PR labels
            pull-requests: write # required to create, update, and close release PRs
            statuses: write # required to mirror dispatched release PR CI results
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  fetch-depth: 0
                  persist-credentials: true

            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm clean-install --ignore-scripts

            - name: Maintain release pull request
              env:
                  GH_TOKEN: ${{ github.token }}
              run: npx just prepare-release
